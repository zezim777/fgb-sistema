<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGB Cloud - Registro v8.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        /* TELAS DE ACESSO */
        .auth-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        .hidden { display: none; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-link { background: none; color: var(--primary); border: none; font-size: 0.85rem; text-decoration: underline; margin-top: 15px; cursor: pointer; }

        /* SISTEMA */
        #main-system { display: none; width: 100%; max-width: 900px; padding: 10px; align-self: flex-start; margin-top: 20px; }
        header { text-align: center; padding: 15px; background: var(--primary); color: white; border-radius: 8px; margin-bottom: 20px; position: relative; }
        .btn-sair { position: absolute; right: 15px; top: 15px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="login-screen" class="auth-card">
        <img src="https://fgb.riobranco.ac.gov.br/wp-content/uploads/2021/04/Logo-FGB-2021.png" alt="FGB" style="width: 100px; margin-bottom: 10px;">
        <h2>Entrar</h2>
        <input type="text" id="login-user" placeholder="Usuário">
        <input type="password" id="login-pass" placeholder="Senha">
        <button onclick="fazerLogin()">ACESSAR SISTEMA</button>
        <button class="btn-link" onclick="alternarTela('cadastro-screen')">Não tem conta? Crie aqui</button>
        <p id="error-login" style="color:red; display:none; margin-top:10px;">Usuário ou senha incorretos!</p>
    </div>

    <div id="cadastro-screen" class="auth-card hidden">
        <h2>Criar Usuário</h2>
        <p style="font-size: 0.8rem; color: #666;">Escolha seu nome de acesso e senha.</p>
        <input type="text" id="reg-user" placeholder="Novo Usuário">
        <input type="password" id="reg-pass" placeholder="Nova Senha">
        <button onclick="cadastrarUsuario()" style="background: var(--accent);">CADASTRAR E ENTRAR</button>
        <button class="btn-link" onclick="alternarTela('login-screen')">Já tenho conta. Voltar</button>
    </div>

    <div id="main-system">
        <header>
            <button class="btn-sair" onclick="fazerLogout()">Sair</button>
            <h1>FGB Cloud</h1>
            <p id="user-display" style="font-size: 0.7rem;">Operador: </p>
        </header>
        <p style="text-align:center;">Sistema de Licitações Ativo ✅</p>
    </div>

<script>
    // --- FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyCnYlfhCCLj5btCZB86RhEKYc7kjFMwlaw",
        authDomain: "sistema-de-licitacoes.firebaseapp.com",
        databaseURL: "https://sistema-de-licitacoes-default-rtdb.firebaseio.com",
        projectId: "sistema-de-licitacoes",
        storageBucket: "sistema-de-licitacoes.firebasestorage.app",
        messagingSenderId: "459656328732",
        appId: "1:459656328732:web:940b71d2f3abfe335b91d9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- LOGICA DE TELAS ---
    function alternarTela(id) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('cadastro-screen').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    // --- CADASTRO ---
    function cadastrarUsuario() {
        const user = document.getElementById('reg-user').value.toLowerCase().trim();
        const pass = document.getElementById('reg-pass').value;

        if (user.length < 3 || pass.length < 3) return alert("Mínimo 3 caracteres!");

        // Verifica se usuário já existe
        db.ref('usuarios/' + user).once('value', snapshot => {
            if (snapshot.exists()) {
                alert("Este nome de usuário já está em uso!");
            } else {
                db.ref('usuarios/' + user).set({
                    usuario: user,
                    senha: pass,
                    dataCriacao: Date.now()
                }).then(() => {
                    alert("Conta criada com sucesso!");
                    localStorage.setItem('fgb_logado', 'true');
                    localStorage.setItem('fgb_user', user);
                    location.reload();
                });
            }
        });
    }

    // --- LOGIN ---
    function fazerLogin() {
        const user = document.getElementById('login-user').value.toLowerCase().trim();
        const pass = document.getElementById('login-pass').value;

        db.ref('usuarios/' + user).once('value', snapshot => {
            const dados = snapshot.val();
            if (dados && dados.senha === pass) {
                localStorage.setItem('fgb_logado', 'true');
                localStorage.setItem('fgb_user', user);
                mostrarSistema();
            } else {
                document.getElementById('error-login').style.display = 'block';
            }
        });
    }

    function mostrarSistema() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('cadastro-screen').style.display = 'none';
        document.getElementById('main-system').style.display = 'block';
        document.getElementById('user-display').innerText = "Operador: " + localStorage.getItem('fgb_user').toUpperCase();
    }

    if (localStorage.getItem('fgb_logado') === 'true') mostrarSistema();
    function fazerLogout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
